# DOE: tubo 2DOF, un solo caso a Ap = 17 mm y 9990 rpm (la configuracion que estaba en el script).
# Uso:  python doe_runner.py --config tube_ap17
extends: base

doe_name: Tube_2DOF_dexel_20e-5_dt_200_Spd_9990_Ap_17
mode: sweep
sweep:                       # listas del MISMO largo; un escalar se repite en todos los casos
  $Ap_start$:  [17.0e-3]
  $Ap_end$:    17.0e-3
  $spin_rate$: 9990.0
  $f_tooth$:   0.05
  $dxl_size$:  2.0e-4
  $nb_dt_rev$: 200
