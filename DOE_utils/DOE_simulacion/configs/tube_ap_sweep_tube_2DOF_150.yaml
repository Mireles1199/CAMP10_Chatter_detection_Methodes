# DOE: el mismo tubo, y SOLO cambia el Ap: 16 casos, de 0.5 a 2.0 veces el Ap critico (8.6052 mm),
# cada caso con profundidad fija (Ap_start = Ap_end). Spin y demas parametros iguales en todos.
# Uso:  python doe_runner.py --config tube_ap_sweep
extends: base

nb_proc: 3

doe_name: Tube_2DOF_dexel_20e-5_dt_200_Spd_12098_Ap_0.5-1.5
mode: sweep
sweep:
  $Ap_start$: &ap_tube         # [m]  kappa = Ap / 8.605 mm
    - 4.3026e-3                # 0.5
    - 5.16312e-3               # 0.6
    - 6.02364e-3               # 0.7
    - 6.88416e-3               # 0.8
    - 7.74468e-3               # 0.9
    - 8.6052e-3                # 1.0
    - 9.46572e-3               # 1.1
    - 10.32624e-3              # 1.2
    - 11.18676e-3              # 1.3
    - 12.04728e-3              # 1.4
    - 12.9078e-3               # 1.5
    # - 13.76832e-3              # 1.6
    # - 14.62884e-3              # 1.7
    # - 15.48936e-3              # 1.8
    # - 16.34988e-3              # 1.9
    # - 17.2104e-3               # 2.0
  $Ap_end$: *ap_tube           # misma lista: profundidad fija en cada caso
  $spin_rate$: 12098.28          # escalares: se repiten en los 16 casos
  $f_tooth$:   0.05
  $dxl_size$:  20.0e-5
  $nb_dt_rev$: 200

ap_ref:                        # para que kappa salga 0.5, 0.6 ... 2.0
  mode: manual
  manual: 8.605e-3
