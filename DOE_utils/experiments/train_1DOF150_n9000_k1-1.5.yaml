name: train_1DOF150_n9000_k1-1.5
description: training, 1DOF_150Hz, n = 9000 rpm, 2 kappa 1-1.5, template Ap_Cons_test_ind
stages:
- simulate
- extract
- label_template
- label_build
- indicators
- static_deflection
- noise
- noise_indicators
- model_snr
runs:
- simulation:
    base_dir: D:/Thesis/03-Code_Storage/02-Altintlas_Nessy2m_Storage/Data/1DOF_150_Ap_Cont_test_ind
    case: 1DOF_150Hz
    n2m_bat: C:/Users/quiqu/OneDrive-ensam.eu/Desktop/Thesis/03-Code/01-Nessy2m/VP2025.1.0/VP2025.1.0/nessy2m/n2m.bat
    doe_name: DOE_train_1DOF150_n9000_k1-1.5
    nb_proc: 2
    mode: sweep
    sweep:
      $Ap_start$:
      - 0.008056
      $Ap_end$:
      - 0.008056
      $spin_rate$:
      - 9000.0
      $f_tooth$:
      - 0.05
      $dxl_size$:
      - 0.0002
      $nb_dt_rev$:
      - 200
    ap_ref:
      mode: none
    extract_signals:
    - Axial_disp
    - Axial_vel
    - Axial_acc
    force_signal: res_R_p
label:
  strategy: amplitude
  amp_signal: Axial_disp
  base_attr: $f_tooth$
  base_scale: 0.001
  lim_inf_pct: 10.0
  lim_sup_pct: 40.0
  warmup: 0.0
indicators:
  variants:
    rms_cv_revo_aux4_n_aux4_dec7_1step:
      indicator: RMS_CV
      func: Default
      mode: by_revolution
      signal: Axial_vel
      params_physical:
        T_rev: T_rev
        N_rev_window: 4
        step_rev: 1
        n_max_mode: frames
        n_max_rev: 4
        cv_threshold: null
        rms_threshold: null
        n_min_cv: 2
        warmup_ignore_alerts: false
        use_unbiased_std: true
        eps: 1.0e-12
        detrend: false
        pad_mode: none
        stable_time: null
        z: 3.0
        alpha: 0.05
        fallback_mad: true
    ssq_revo_aux4_n_aux4_dec7_1step:
      indicator: SST_SVD
      func: Default
      mode: by_revolution
      signal: Axial_vel
      params_physical:
        T_rev: T_rev
        N_rev_window: 4
        step_rev: 1
        Ai_length_mode: frames
        Ai_length_rev: 4
        n_fft_power: 3
        mode: causal_inclusive
        sigma: 6.0
        frac_stable: 0.3610633440512648
        training_intervals: null
        alpha: 0.05
        z: 3.0
        fallback_mad: false
  f_modal: 150.0
  cases: all
  workers: 6
