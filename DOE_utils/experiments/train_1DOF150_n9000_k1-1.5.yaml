name: train_1DOF150_n9000_k1-1.5
kind: training
description: training, 1DOF_150Hz, n = 9000 rpm, 2 kappa 1-1.5, template Ap_Cons_test_ind
runs:
- config: DOE_train_1DOF150_n9000_k1-1.5
label:
  strategy: amplitude
  amp_signal: Axial_disp
  base_attr: $f_tooth$
  base_scale: 0.001
  lim_inf_pct: 10.0
  lim_sup_pct: 40.0
  warmup: 0.0
indicators:
  variants:
  - rms_cv_revo_aux4_n_aux4_dec7_1step
  - ssq_revo_aux4_n_aux4_dec7_1step
  f_modal: 150.0
  cases: all
  workers: 6
