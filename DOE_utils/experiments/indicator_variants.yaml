      N_rev_window: 4
      step_rev: 1
      n_max_mode: frames
      n_max_rev: 4
      cv_threshold: null
      rms_threshold: null
      n_min_cv: 2
      warmup_ignore_alerts: false
      use_unbiased_std: true
      eps: 1.0e-12
      detrend: false
      pad_mode: none
      stable_time: null
