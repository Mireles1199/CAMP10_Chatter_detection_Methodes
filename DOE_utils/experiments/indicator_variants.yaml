# Indicator variant library for experiments (doe_indicators.py --experiment).
# Generated 2026-10-01 from the CONFIG block of DOE_analisis/doe_indicators.py (all INDICATOR_CONFIG_* / RUNS,
# enabled or not), so a variant reproduces exactly what that CONFIG ran.
#
# - The key of a variant is the name of its group in doe_indicator_results.h5 (same names as before).
# - Values resolved PER CASE (never written here): "T_rev" = 60 / $spin_rate$ of the case,
#   "T_modal" = 1 / f_modal of the experiment, "10*T_rev" = 10 x that T_rev.
# - t_stable_total, cut_end_time, t_theorical and training_intervals are the legacy values of the CONFIG: with the
#   external reference that every experiment gives (its training dataset) they are not used by the detection.
# - A variant that already has results is not edited: duplicate it under a new name (the app enforces this).
# - cut.start [s]: start of the analysed signal; cut.end null = end of each case signal.
cut:
  start: 0.05
  end: null
variants:
  maxent_revo_dec7_1step:
    indicator: MaxEnt_SPRT
    func: Default
    mode: by_revolution
    signal: Axial_vel
    params_physical:
      T_rev: T_rev
      N_rev_window: 7
      step_rev: 1
      segmentation: opr
      t_stable_total: 5.365770208787228
      training_intervals: null
      alpha: 0.00135
