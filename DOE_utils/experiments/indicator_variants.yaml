# Indicator variant PRESETS: a new row of an experiment's indicator table starts from one of these
# (the experiment keeps its own copy, so editing this file never changes an experiment already set up).
# Generated 2026-10-01 from the CONFIG block of DOE_analisis/doe_indicators.py (all INDICATOR_CONFIG_* / RUNS,
# enabled or not), so a variant reproduces exactly what that CONFIG ran.
#
# - The key of a variant is the name of its group in doe_indicator_results.h5 (same names as before).
# - Values resolved PER CASE (never written here): "T_rev" = 60 / $spin_rate$ of the case,
#   "T_modal" = 1 / f_modal of the experiment, "10*T_rev" = 10 x that T_rev.
# - t_theorical (= the old fixed t_GT), and for MaxEnt t_stable_total / cut_end_time, were removed on 2026-10-02:
#   with the external reference every experiment gives (a labelled dataset) the detection never reads them
#   (MaxEnt still gets t_stable_total = None, its signature asks for it). training_intervals stays null.
# - The app shows these as a table inside each experiment (Indicators > Edit config); add a preset here only to
#   offer it to new tables.
# - cut.start [s]: start of the analysed signal; cut.end null = end of each case signal.
cut:
  start: 0.05
  end: null
variants:
  maxent_revo_dec7_1step:
    indicator: MaxEnt_SPRT
    func: Default
    mode: by_revolution
    signal: Axial_vel
    params_physical:
      T_rev: T_rev
      N_rev_window: 7
      step_rev: 1
      segmentation: opr
      training_intervals: null
      alpha: 0.00135
      beta: 0.00135
      reset_on_H0: true
      cut_start_time: 0.05
  rms_cv_revo_aux4_n_aux4_dec7_1step:
