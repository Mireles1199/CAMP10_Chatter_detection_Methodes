[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-integral"
version = "0.1.0"
description = "Green's integral (phase-space area) method for chatter detection"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Enrique Mireles", email = "enrique.mireles-hernandez@ensam.eu" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10",
  "matplotlib>=3.6",
  "scikit-learn>=1.0",
  "h5py>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
